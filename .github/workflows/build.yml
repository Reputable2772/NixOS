name: "Flake Build"

on:
  push:

permissions:
  contents: read
  packages: write

jobs:
  build-system:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          swap-storage: false

      - name: Substituters
        id: substituters
        run: |
          echo "TRUSTED_PUBLIC_KEYS=$(./nix.sh ci_get trusted-public-keys)" >> "$GITHUB_OUTPUT"
          echo "SUBSTITUTERS=$(./nix.sh ci_get trusted-substituters)" >> "$GITHUB_OUTPUT"

      - uses: samueldr/lix-gha-installer-action@latest
        name: "Install Lix"
        with:
          extra_nix_config: |
            trusted-public-keys = ${{ steps.substituters.outputs.TRUSTED_PUBLIC_KEYS }}
            substituters = ${{ steps.substituters.outputs.SUBSTITUTERS }}
            experimental-features = flakes nix-command pipe-operator
            accept-flake-config = true

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build & push all outputs
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix develop .#ci --command bash -c "nix-build-all --systems $(uname -m)-linux --override-input flake . --out-link flake --cachix-cache spearman4157"
          nix build .#packages.$(uname -m)-linux.deploy --out-link deploy.json

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_AUTH: ${{ secrets.GITHUB_TOKEN }}
          # Uses the same podman version as in the nix flake
          # The AppArmor code below solves the `failed to reexec: Permission denied` error
        run: |
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

          PODMAN_PATH="$(nix build --print-out-paths $(nix eval --impure --raw --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.${builtins.currentSystem}.podman'))/bin/podman"
          echo "$REGISTRY_AUTH" | $PODMAN_PATH login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build & push container images
        run: |
          nix build .#packages.$(uname -m)-linux.container-builds --out-link container-builds
          mkdir -p ~/.config/systemd/user
          cp -a container-builds/. ~/.config/systemd/user/
          systemctl --user daemon-reload

          cd container-builds

          if ls *.service >/dev/null 2>&1; then
            units=$(ls *.service)

            rc=0
            output=$(systemctl --user start $units 2>&1) || rc=$?

            if [ "$rc" -ne 0 ]; then
              echo "$output"
              systemctl --user status $units --no-pager --full || true
              exit "$rc"
            fi
          fi

      - name: Activate Cachix deployment
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_ACTIVATE_TOKEN: ${{ secrets.CACHIX_ACTIVATE_TOKEN }}
        run: |
          cat deploy.json
          nix develop .#ci --command cachix deploy activate deploy.json --async
